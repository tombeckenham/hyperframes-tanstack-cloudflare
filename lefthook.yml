# Pre-commit gate: oxlint -> oxfmt --check -> tsc.
#
# Install with `bun run prepare` (or `bunx lefthook install`) after a fresh
# clone — lefthook does not wire the git hooks on `bun install` alone.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: bunx oxlint {staged_files}

    - name: format
      # Formatting covers more than the lint globs (css, jsonc), so let oxfmt
      # see every staged file and filter through .oxfmtrc.json ignorePatterns.
      run: bunx oxfmt --check --no-error-on-unmatched-pattern {staged_files}

    - name: typecheck
      # Whole-project: TypeScript has no useful staged-file mode, because a
      # change in one file can break the types of a file that is not staged.
      run: bun run typecheck
