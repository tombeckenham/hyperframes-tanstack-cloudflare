<!doctype html>
<!--
  The baked starter composition. This is what a visitor sees in the Player tab
  (and in Hyperframes Studio) before the agent has authored anything — it
  replaces the blank example's black frame, which read as "broken", with a
  5-second intro. The Dockerfile copies this over the scaffolded index.html
  and `hyperframes check` gates it at build time, so contract mistakes here
  fail the image build, not a visitor's first impression.

  It follows the composition contract (src/tools/recipe.ts "author"): clips
  are DIRECT children of #root, the GSAP timeline is built synchronously at
  page init, registered paused under window.__timelines[data-composition-id],
  and everything is finite — no repeat: -1.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        /* Just Inter: the renderer aliases fallback names to bundled fonts
           anyway, and naming the target font keeps preview and render
           identical. */
        font-family: 'Inter', sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05060f;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1200px 800px at 30% 18%, #101a3a 0%, transparent 60%),
          #05060f;
      }
      .orbs {
        position: absolute;
        inset: 0;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.45;
      }
      .orb-a {
        width: 560px;
        height: 560px;
        left: 160px;
        top: 500px;
        background: #1d4ed8;
      }
      .orb-b {
        width: 440px;
        height: 440px;
        right: 200px;
        top: 90px;
        background: #7c3aed;
      }
      .title {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }
      .word {
        display: flex;
        font-size: 148px;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: #f8fafc;
      }
      .word span {
        display: inline-block;
        transform: translateY(70px);
        opacity: 0;
      }
      .rule {
        width: 0;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, #38bdf8, #a78bfa);
      }
      .tagline {
        font-size: 40px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: #94a3b8;
        opacity: 0;
        transform: translateY(26px);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div id="bg" class="clip bg" data-start="0" data-duration="5"></div>
      <div id="orbs" class="clip orbs" data-start="0" data-duration="5">
        <div class="orb orb-a" id="orb-a"></div>
        <div class="orb orb-b" id="orb-b"></div>
      </div>
      <div id="title" class="clip title" data-start="0" data-duration="5">
        <div class="word" id="word">
          <span>H</span><span>y</span><span>p</span><span>e</span><span>r</span
          ><span>f</span><span>r</span><span>a</span><span>m</span><span>e</span
          ><span>s</span>
        </div>
        <div class="rule" id="rule"></div>
        <div class="tagline" id="tagline">Describe a video to begin</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {}
      const tl = gsap.timeline({ paused: true })
      tl.to(
        '#word span',
        { y: 0, opacity: 1, duration: 0.7, stagger: 0.05, ease: 'power3.out' },
        0.4,
      )
        .to('#rule', { width: 560, duration: 0.8, ease: 'power2.inOut' }, 1.2)
        .to(
          '#tagline',
          { y: 0, opacity: 1, duration: 0.6, ease: 'power2.out' },
          1.7,
        )
        .to(
          '#orb-a',
          { x: 150, y: -90, duration: 4.6, ease: 'sine.inOut' },
          0.2,
        )
        .to(
          '#orb-b',
          { x: -130, y: 90, duration: 4.6, ease: 'sine.inOut' },
          0.2,
        )
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
